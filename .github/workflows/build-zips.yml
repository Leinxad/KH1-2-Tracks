name: Build and publish track patches

on:
  push:
    branches: [main]
    paths:
      - 'kh1/tracks/Classic/**/*.scd'
      - 'kh1/tracks/Remastered/**/*.scd'
      - 'kh2/tracks/Classic/**/*.scd'
      - 'kh2/tracks/Remastered/**/*.scd'
      - 'kh1/raw/**'
      - 'kh1soundtrack.lua'
      - 'kh2soundtrack.lua'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Rebuild ALL patches (not just changed)'
        type: boolean
        default: false

jobs:
  build:
    outputs:
      count: ${{ steps.changed.outputs.count }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect affected folders
        id: changed
        run: |
          changed_files=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_all }}" = "true" ]; then
            folders=$(find kh1/tracks kh2/tracks -mindepth 1 -maxdepth 1 -type d \
              | grep -E '/(Classic|Remastered)$' | sort)
            switcher_games="kh1 kh2"
          else
            changed_files=$(git diff --name-only HEAD~1 HEAD)
            folders=$(git diff --name-only HEAD~1 HEAD \
              | grep -E '^(kh1|kh2)/tracks/(Classic|Remastered)/.*\.scd$' \
              | sed -E 's|^(kh[12]/tracks/[^/]+)/.*|\1|' \
              | sort -u)
            switcher_games=""
            if echo "$changed_files" | grep -q '^kh1/raw/'; then
              switcher_games="$switcher_games kh1"
            fi
            if echo "$changed_files" | grep -q '^kh1soundtrack.lua$'; then
              switcher_games="$switcher_games kh1"
            fi
            if echo "$changed_files" | grep -q '^kh2soundtrack.lua$'; then
              switcher_games="$switcher_games kh2"
            fi
          fi
          track_games=$(printf '%s\n' "$folders" | sed -n 's|^\(kh[12]\)/tracks/[^/]*$|\1|p' | sort -u)
          switcher_games=$(printf '%s\n%s\n' "$track_games" "$switcher_games" | tr ' ' '\n' | sort -u | grep -v '^$')
          echo "folders<<EOF" >> "$GITHUB_OUTPUT"
          echo "$folders" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "switcher_games<<EOF" >> "$GITHUB_OUTPUT"
          echo "$switcher_games" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "track_games<<EOF" >> "$GITHUB_OUTPUT"
          echo "$track_games" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          folder_count=$(echo "$folders" | grep -c '.') || folder_count=0
          switcher_count=$(echo "$switcher_games" | grep -c '.') || switcher_count=0
          count=$folder_count
          if [ "$switcher_count" -gt "$count" ]; then
            count=$switcher_count
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.count != '0'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.changed.outputs.count != '0'
        run: npm ci

      - name: Build patches
        if: steps.changed.outputs.count != '0'
        run: |
          mkdir -p dist

          # Build Classic / Remastered patches for changed track folders.
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            game=$(echo "$folder" | cut -d/ -f1)
            version=$(echo "$folder" | cut -d/ -f3)
            node scripts/build.js --out=dist --game="$game" --type="$version"
          done <<< "${{ steps.changed.outputs.folders }}"

          # Build Switcher patches for games with changed tracks / lua / raw files.
          while IFS= read -r game; do
            [ -z "$game" ] && continue
            node scripts/build.js --out=dist --game="$game" --type=Switcher
          done <<< "${{ steps.changed.outputs.switcher_games }}"

      - name: Upload patches as artifact
        if: steps.changed.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: track-patches
          path: dist/*pcpatch
          retention-days: 1

      - name: No changes detected
        if: steps.changed.outputs.count == '0'
        run: echo "No SCD files changed — nothing to build."

  publish:
    needs: build
    if: needs.build.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download patches artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: track-patches

      - name: Upload to KH1-2-Tracks release
        if: steps.download.outcome == 'success'
        run: |
          gh release create tracks --title "Track Bundles" --notes "Auto-generated track patch bundles." 2>/dev/null || true
          for f in *pcpatch; do
            echo "Uploading $f..."
            gh release upload tracks "$f" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: No patches to publish
        if: steps.download.outcome != 'success'
        run: echo "No track-patches artifact found — build produced no patches."
